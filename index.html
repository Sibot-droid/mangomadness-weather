<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2a78d6">
<title>MangoMadness Weather</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  color-scheme: light;
  --bg:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --line:#eee; --border:rgba(11,11,11,.10);
  --temp:#eb6834; --tin:#2a78d6; --hum:#2a78d6; --wind:#1baf7a; --pres:#4a3aa7;
  --rain:#256abf; --solar:#eda100; --dew:#1baf7a;
  --sp1:#cde2fb; --sp2:#86b6ef; --sp3:#3987e5; --sp4:#1c5cab; --sp5:#0d366b;
}
@media (prefers-color-scheme:dark){ :root:where(:not([data-theme="light"])){
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --line:#2a2a28; --border:rgba(255,255,255,.10);
  --temp:#d95926; --tin:#3987e5; --hum:#3987e5; --wind:#199e70; --pres:#9085e9;
  --rain:#3987e5; --solar:#c98500; --dew:#199e70;
  --sp1:#9ec5f4; --sp2:#5598e7; --sp3:#3987e5; --sp4:#256abf; --sp5:#18407f;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --line:#2a2a28; --border:rgba(255,255,255,.10);
  --temp:#d95926; --tin:#3987e5; --hum:#3987e5; --wind:#199e70; --pres:#9085e9;
  --rain:#3987e5; --solar:#c98500; --dew:#199e70;
  --sp1:#9ec5f4; --sp2:#5598e7; --sp3:#3987e5; --sp4:#256abf; --sp5:#18407f;
}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:0;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
header{max-width:1080px;margin:0 auto;padding:18px 16px 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
button.theme{background:var(--surface);border:1px solid var(--border);color:var(--ink2);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
main{max-width:1080px;margin:0 auto;padding:6px 12px 40px}
#err{display:none;background:#fff3f3;border:1px solid #f3c2c2;color:#a33;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
:root[data-theme="dark"] #err,@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) #err{background:#2a1a1a;border-color:#5a2c2c;color:#e79}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 8px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.tile .cap{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .val{font-size:26px;font-weight:650;margin-top:3px;letter-spacing:-.02em}
.tile .val small{font-size:14px;font-weight:500;color:var(--ink2)}
.tile .note{font-size:12px;color:var(--ink2);margin-top:2px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.ranges{display:flex;gap:6px;margin:14px 2px 4px;flex-wrap:wrap}
.ranges button{background:var(--surface);border:1px solid var(--border);color:var(--ink2);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.ranges button[aria-pressed="true"]{background:var(--tin);border-color:var(--tin);color:#fff;font-weight:600}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 12px 6px}
.card h2{margin:0 0 2px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card .legend{font-size:12px;color:var(--muted);font-weight:400;display:flex;gap:12px;flex-wrap:wrap}
.card .legend span{display:inline-flex;align-items:center;gap:5px}
.chartwrap{position:relative;width:100%;overflow:hidden}
.chartwrap.rose{max-width:400px;margin:0 auto}
svg.chart{width:100%;height:auto;display:block;touch-action:none}
.tt{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.12);opacity:0;transition:opacity .08s;white-space:nowrap;z-index:5}
.tt .tt-t{color:var(--muted);margin-bottom:3px}
.tt .tt-r{display:flex;justify-content:space-between;gap:12px}
.tt b{font-variant-numeric:tabular-nums}
footer{max-width:1080px;margin:0 auto;color:var(--muted);font-size:11.5px;text-align:center;padding:6px 16px 26px;line-height:1.6}
a{color:var(--tin)}
</style>
</head>
<body>
<header>
  <h1 id="brand">🥭 MangoMadness Weather</h1>
  <span class="sub" id="updated">loading…</span>
  <span class="spacer"></span>
  <button class="theme" id="themeBtn" title="Toggle light/dark">◐ Theme</button>
</header>
<main>
  <div id="err"></div>
  <div class="tiles" id="tiles"></div>
  <div class="ranges" id="ranges" role="group" aria-label="Time range">
    <button data-h="6">6h</button>
    <button data-h="24" aria-pressed="true">24h</button>
    <button data-h="72">3d</button>
    <button data-h="168">7d</button>
    <button data-h="0">All</button>
  </div>
  <div class="charts" id="charts"></div>
</main>
<footer id="foot"></footer>

<script>
const DATA_URL = 'data.json';
let RAW=null, RANGE=24;

const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const num=v=>(v===null||v===undefined||v==='')?null:(isFinite(+v)?+v:null);
function timeAgo(iso){const s=(Date.now()-new Date(iso))/1000;if(s<90)return'just now';const m=Math.round(s/60);if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+'h ago';return Math.round(h/24)+'d ago';}
function hhmm(iso){const d=new Date(iso);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function dayLbl(iso){const d=new Date(iso);return d.toLocaleDateString([],{weekday:'short',hour:'2-digit',minute:'2-digit'});}
const compass=d=>{if(d===null)return'';const n=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];return n[Math.round(d/22.5)%16];};

function niceScale(min,max,ticks=4){
  if(min===max){min-=1;max+=1;}
  const span=max-min,step0=span/ticks,mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag,step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,out=[];
  for(let v=lo;v<=hi+step/2;v+=step)out.push(+v.toFixed(6));
  return{lo,hi,ticks:out};
}

// Build one SVG chart. type: 'line' or 'bar'. series: [{key,color,label,dash?,width?}]
function chart(card, pts, series, opts={}){
  const W=800,H=opts.h||250,mL=44,mR=12,mT=10,mB=24;
  const iw=W-mL-mR, ih=H-mT-mB;
  const xs=pts.map(p=>new Date(p.t).getTime());
  const xmin=Math.min(...xs),xmax=Math.max(...xs),xspan=(xmax-xmin)||1;
  const X=t=>mL+((t-xmin)/xspan)*iw;
  let vmin=Infinity,vmax=-Infinity;
  for(const s of series)for(const p of pts){const v=num(p[s.key]);if(v!==null){if(v<vmin)vmin=v;if(v>vmax)vmax=v;}}
  if(!isFinite(vmin)){vmin=0;vmax=1;}
  if(opts.zeroFloor&&vmin>0)vmin=0;
  const sc=niceScale(vmin,vmax,4);
  const Y=v=>mT+ih-((v-sc.lo)/((sc.hi-sc.lo)||1))*ih;
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('class','chart');svg.setAttribute('preserveAspectRatio','none');
  const add=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);svg.appendChild(e);return e;};
  // gridlines + y labels
  for(const tv of sc.ticks){const y=Y(tv);
    add('line',{x1:mL,y1:y,x2:W-mR,y2:y,stroke:'var(--grid)','stroke-width':1});
    const t=add('text',{x:mL-6,y:y+3.5,'text-anchor':'end',fill:'var(--muted)','font-size':11});t.textContent=(+tv.toFixed(2));}
  // x labels (start / mid / end)
  const xt=[xmin,(xmin+xmax)/2,xmax];
  xt.forEach((tx,i)=>{const t=add('text',{x:X(tx),y:H-6,'text-anchor':i===0?'start':i===2?'end':'middle',fill:'var(--muted)','font-size':11});t.textContent=(xmax-xmin>36e5*20)?dayLbl(new Date(tx).toISOString()):hhmm(new Date(tx).toISOString());});
  add('line',{x1:mL,y1:mT+ih,x2:W-mR,y2:mT+ih,stroke:'var(--axis)','stroke-width':1});
  // marks
  if(opts.type==='bar'){
    const s=series[0];const bw=Math.max(2,iw/pts.length*0.7);
    for(const p of pts){const v=num(p[s.key]);if(v===null||v<=0)continue;const x=X(new Date(p.t).getTime()),y=Y(v),y0=Y(0);
      add('rect',{x:x-bw/2,y:Math.min(y,y0),width:bw,height:Math.max(1.5,Math.abs(y0-y)),rx:2,fill:s.color});}
  }else{
    for(const s of series){let d='',pen=false;
      for(const p of pts){const v=num(p[s.key]);const x=X(new Date(p.t).getTime());
        if(v===null){pen=false;continue;}const y=Y(v);d+=(pen?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';pen=true;}
      add('path',{d,fill:'none',stroke:s.color,'stroke-width':s.width||2,'stroke-linejoin':'round','stroke-linecap':'round','stroke-dasharray':s.dash||'','vector-effect':'non-scaling-stroke'});
    }
  }
  // hover layer
  const hoverLine=add('line',{x1:0,y1:mT,x2:0,y2:mT+ih,stroke:'var(--axis)','stroke-width':1,opacity:0});
  const dots=series.map(s=>add('circle',{r:3.5,fill:s.color,stroke:'var(--surface)','stroke-width':1.5,opacity:0}));
  const wrap=document.createElement('div');wrap.className='chartwrap';
  const tip=document.createElement('div');tip.className='tt';
  wrap.appendChild(svg);wrap.appendChild(tip);card.appendChild(wrap);
  function move(ev){
    const r=svg.getBoundingClientRect();const px=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
    const vx=px/r.width*W;const t=xmin+((vx-mL)/iw)*xspan;
    let bi=0,bd=Infinity;pts.forEach((p,i)=>{const dd=Math.abs(new Date(p.t).getTime()-t);if(dd<bd){bd=dd;bi=i;}});
    const p=pts[bi];const hx=X(new Date(p.t).getTime());
    hoverLine.setAttribute('x1',hx);hoverLine.setAttribute('x2',hx);hoverLine.setAttribute('opacity',1);
    let rows='';series.forEach((s,i)=>{const v=num(p[s.key]);
      if(v===null){dots[i].setAttribute('opacity',0);}else{dots[i].setAttribute('cx',hx);dots[i].setAttribute('cy',Y(v));dots[i].setAttribute('opacity',1);}
      rows+=`<div class="tt-r"><span><span class="dot" style="background:${s.color}"></span>${esc(s.label)}</span><b>${v===null?'—':v}${opts.unit?(' '+opts.unit):''}</b></div>`;});
    tip.innerHTML=`<div class="tt-t">${esc(dayLbl(p.t))}</div>${rows}`;
    tip.style.opacity=1;
    const tw=tip.offsetWidth;let left=hx/W*r.width+12;if(left+tw>r.width)left=hx/W*r.width-tw-12;
    tip.style.left=Math.max(2,left)+'px';tip.style.top='6px';
  }
  function leave(){hoverLine.setAttribute('opacity',0);dots.forEach(d=>d.setAttribute('opacity',0));tip.style.opacity=0;}
  svg.addEventListener('mousemove',move);svg.addEventListener('mouseleave',leave);
  svg.addEventListener('touchstart',move,{passive:true});svg.addEventListener('touchmove',move,{passive:true});svg.addEventListener('touchend',leave);
}

// Wind rose: 16 compass sectors, petals stacked by speed bin (sequential blue = strength).
function windRose(card, pts){
  const NS='http://www.w3.org/2000/svg';
  const C=getComputedStyle(document.documentElement),col=n=>C.getPropertyValue(n).trim();
  const bins=[{max:5,c:col('--sp1')},{max:15,c:col('--sp2')},{max:30,c:col('--sp3')},{max:50,c:col('--sp4')},{max:1e9,c:col('--sp5')}];
  const binLbl=['<5','5–15','15–30','30–50','50+'];
  const CALM=1,N=16;
  const counts=Array.from({length:N},()=>bins.map(()=>0));
  let calm=0,total=0;
  for(const p of pts){const s=num(p.windKmh),d=num(p.dir);
    if(s===null)continue;total++;
    if(s<CALM||d===null){calm++;continue;}
    const sec=((Math.round(d/(360/N))%N)+N)%N;
    let bi=bins.findIndex(b=>s<b.max);if(bi<0)bi=bins.length-1;
    counts[sec][bi]++;}
  const denom=total||1;
  const secFreq=counts.map(c=>c.reduce((a,b)=>a+b,0)/denom*100);
  const maxF=Math.max(1,...secFreq);
  const step=maxF<=5?1:maxF<=10?2:maxF<=25?5:10;
  const ringMax=Math.max(step,Math.ceil(maxF/step)*step);
  const cx=160,cy=158,R=112,hole=20;
  const Rr=f=>hole+(f/ringMax)*(R-hole);
  const P=(b,r)=>[cx+r*Math.sin(b*Math.PI/180),cy-r*Math.cos(b*Math.PI/180)];
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 320 336');svg.setAttribute('class','chart');
  const add=(t,at,tx)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);if(tx!=null)e.textContent=tx;svg.appendChild(e);return e;};
  for(let v=step;v<=ringMax+.01;v+=step){const r=Rr(v);
    add('circle',{cx,cy,r,fill:'none',stroke:'var(--grid)','stroke-width':1});
    add('text',{x:cx+3,y:cy-r+11,fill:'var(--muted)','font-size':10},v+'%');}
  const dirs=['N','NE','E','SE','S','SW','W','NW'];
  for(let i=0;i<8;i++){const b=i*45,pp=P(b,R),ph=P(b,hole);
    add('line',{x1:ph[0],y1:ph[1],x2:pp[0],y2:pp[1],stroke:'var(--grid)','stroke-width':1});
    const pl=P(b,R+17);add('text',{x:pl[0],y:pl[1]+4,'text-anchor':'middle',fill:i%2?'var(--muted)':'var(--ink2)','font-size':i%2?10:12,'font-weight':i%2?400:700},dirs[i]);}
  const hw=360/N/2-1.4;
  for(let s=0;s<N;s++){const bc=s*(360/N);let cum=0;
    for(let bi=0;bi<bins.length;bi++){const cnt=counts[s][bi];if(!cnt)continue;
      const f0=cum/denom*100,f1=(cum+cnt)/denom*100;cum+=cnt;
      const r0=Rr(f0),r1=Rr(f1),a0=bc-hw,a1=bc+hw;
      const A=P(a0,r0),B=P(a0,r1),D=P(a1,r1),E=P(a1,r0);
      const path=add('path',{d:`M ${A[0]} ${A[1]} L ${B[0]} ${B[1]} A ${r1} ${r1} 0 0 1 ${D[0]} ${D[1]} L ${E[0]} ${E[1]} A ${r0} ${r0} 0 0 0 ${A[0]} ${A[1]} Z`,fill:bins[bi].c,stroke:'var(--surface)','stroke-width':1});
      const tt=document.createElementNS(NS,'title');tt.textContent=`${compass(bc)} · ${binLbl[bi]} km/h · ${cnt} reading${cnt>1?'s':''} (${(cnt/denom*100).toFixed(1)}%)`;path.appendChild(tt);}}
  add('circle',{cx,cy,r:hole,fill:'var(--surface)',stroke:'var(--grid)','stroke-width':1});
  add('text',{x:cx,y:cy-2,'text-anchor':'middle',fill:'var(--muted)','font-size':9.5},'calm');
  add('text',{x:cx,y:cy+10,'text-anchor':'middle',fill:'var(--ink)','font-size':12,'font-weight':700},Math.round(calm/denom*100)+'%');
  const wrap=document.createElement('div');wrap.className='chartwrap rose';wrap.appendChild(svg);card.appendChild(wrap);
}

function card(title, legend){
  const c=document.createElement('div');c.className='card';
  const leg=legend?('<span class="legend">'+legend.map(l=>`<span><span class="dot" style="background:${l.c}"></span>${esc(l.t)}</span>`).join('')+'</span>'):'';
  c.innerHTML=`<h2>${esc(title)}${leg}</h2>`;
  $('#charts').appendChild(c);return c;
}

function tile(cap,val,unit,note,color){
  const d=document.createElement('div');d.className='tile';
  const dot=color?`<span class="dot" style="background:${color}"></span>`:'';
  d.innerHTML=`<div class="cap">${dot}${esc(cap)}</div><div class="val">${val}${unit?` <small>${esc(unit)}</small>`:''}</div>${note?`<div class="note">${esc(note)}</div>`:''}`;
  $('#tiles').appendChild(d);
}

function render(){
  const d=RAW;if(!d)return;
  $('#updated').textContent=(d.station?d.station+' · ':'')+'updated '+timeAgo(d.generated);
  const cur=d.current||{};
  // filter by range
  let pts=d.series.slice();
  if(RANGE>0){const cut=Date.now()-RANGE*36e5;pts=pts.filter(p=>new Date(p.t).getTime()>=cut);}
  if(pts.length<2)pts=d.series.slice(-Math.max(2,pts.length));
  const C=getComputedStyle(document.documentElement);
  const col=n=>C.getPropertyValue(n).trim();

  // tiles
  const tl=$('#tiles');tl.innerHTML='';
  const f=(v,dp=1)=>v===null||v===undefined?'—':(+v).toFixed(dp);
  tile('Temperature',f(cur.tempC),'°C',cur.dewC!=null?`dew point ${f(cur.dewC)}°C`:'',col('--temp'));
  tile('Humidity',f(cur.hum,0),'%','',col('--hum'));
  tile('Wind',f(cur.windKmh),'km/h',(cur.dir!=null?compass(cur.dir)+' · ':'')+(cur.gustKmh!=null?`gust ${f(cur.gustKmh)}`:''),col('--wind'));
  tile('Pressure',f(cur.presHpa,0),'hPa','',col('--pres'));
  tile('Rain today',f(cur.rainMm),'mm',cur.rainRateMm!=null?`rate ${f(cur.rainRateMm,2)} mm/h`:'',col('--rain'));
  tile('Solar',f(cur.solar,0),'W/m²',cur.uv!=null?`UV ${f(cur.uv,0)}`:'',col('--solar'));
  tile('Indoor',f(cur.inTempC),'°C',cur.inHum!=null?`${f(cur.inHum,0)}% humidity`:'',col('--tin'));

  // charts
  $('#charts').innerHTML='';
  windRose(card('Wind rose',[{c:col('--sp1'),t:'<5'},{c:col('--sp2'),t:'5–15'},{c:col('--sp3'),t:'15–30'},{c:col('--sp4'),t:'30–50'},{c:col('--sp5'),t:'50+ km/h'}]),pts);
  chart(card('Temperature (°C)',[{c:col('--temp'),t:'Outdoor'},{c:col('--tin'),t:'Indoor'}]),pts,
    [{key:'tempC',color:col('--temp'),label:'Outdoor'},{key:'inTempC',color:col('--tin'),label:'Indoor'}],{unit:'°C'});
  chart(card('Humidity (%)'),pts,[{key:'hum',color:col('--hum'),label:'Humidity'}],{unit:'%'});
  chart(card('Wind (km/h)',[{c:col('--wind'),t:'Speed'},{c:col('--wind'),t:'Gust (dashed)'}]),pts,
    [{key:'windKmh',color:col('--wind'),label:'Speed'},{key:'gustKmh',color:col('--wind'),label:'Gust',dash:'4 3',width:1.5}],{unit:'km/h',zeroFloor:true});
  chart(card('Pressure (hPa)'),pts,[{key:'presHpa',color:col('--pres'),label:'Pressure'}],{unit:'hPa'});
  chart(card('Rain rate (mm/h)'),pts,[{key:'rainRateMm',color:col('--rain'),label:'Rain rate'}],{unit:'mm/h',type:'bar',zeroFloor:true});
  chart(card('Solar (W/m²)'),pts,[{key:'solar',color:col('--solar'),label:'Solar'}],{unit:'W/m²',zeroFloor:true});

  $('#foot').innerHTML=`${esc(d.station||'')} · ${d.series.length} readings logged · every 5&nbsp;min · times are local · generated ${new Date(d.generated).toLocaleString()}`;
}

async function load(){
  try{
    const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    RAW=await r.json();$('#err').style.display='none';render();
  }catch(e){
    if(!RAW){$('#err').textContent='Could not load weather data ('+e.message+').';$('#err').style.display='block';}
  }
}

// range buttons
$('#ranges').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  [...$('#ranges').children].forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');RANGE=+b.dataset.h;render();});
// theme toggle
const applyTheme=t=>{if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');};
$('#themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  const next=dark?'light':'dark';applyTheme(next);localStorage.setItem('wxtheme',next);render();});
applyTheme(localStorage.getItem('wxtheme'));
